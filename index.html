<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name=""">

<title>ZamCargo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:
    linear-gradient(rgba(0,25,65,.82),
    rgba(0,25,65,.92)),
    url('https://images.unsplash.com/photo-1578575437130-527eed3abbec');
    background-size:cover;
    background-position:center;
    color:white;
}

.hero-section{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.content-box{
    width:100%;
    max-width:420px;
}

.logo{
    width:100px;
    height:auto;
    object-fit:contain;
}

@media(max-width:768px){

.logo{
    width:180px;
}

}

@media(max-width:576px){

.logo{
    width:150px;
}

}

.company-name{
    font-size:3rem;
    font-weight:800;
    line-height:1;
}

.company-name span{
    color:#d89216;
}

.company-sub{
    font-size:.9rem;
    opacity:.85;
}

.hero-title{
    margin-top:50px;
    font-size:2.5rem;
    font-weight:700;
    line-height:1.2;
}

.highlight{
    color:#d89216;
}

.hero-text{
    margin-top:25px;
    font-size:1.2rem;
    color:#d8d8d8;
    line-height:1.6;
}

.slider-dots{
    text-align:center;
    margin:40px 0;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:white;
    display:inline-block;
    margin:0 6px;
    opacity:.5;
}

.dot.active{
    background:#d89216;
    opacity:1;
}

.create-btn{
    width:100%;
    height:70px;
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,.9);
    color:#001d4d;
    font-size:1.8rem;
    font-weight:700;
    transition:.3s;
}

.create-btn:hover{
    transform:translateY(-3px);
}

.login-link{
    text-align:center;
    margin-top:30px;
    font-size:1.1rem;
}

.login-link a{
    text-decoration:none;
    color:white;
    font-weight:700;
}

.login-link a:hover{
    color:#d89216;
}

@media(max-width:768px){

    .company-name{
        font-size:2.5rem;
    }

    .hero-title{
        font-size:2rem;
    }

    .hero-text{
        font-size:1rem;
    }

    .create-btn{
        font-size:1.5rem;
    }
}

@media(max-width:480px){

    .company-name{
        font-size:2rem;
    }

    .hero-title{
        font-size:1.8rem;
    }

    .create-btn{
        height:65px;
        font-size:1.3rem;
    }
}

</style>
</head>
<body>

<div class="hero-section">

<div class="content-box">

    <!-- Logo -->
   <div class="header d-flex align-items-center justify-content-between mb-4">

<button class="btn btn-link text-dark p-0">
    <i class="fas fa-arrow-left fs-3"></i>
</button>

<img src="images/logo.png"
     class="logo"
     alt="ZAMCargo Logo">

<div style="width:40px;"></div>

</div>

    <!-- Text -->
    <h1 class="hero-title">
        Move Anything,<br>
        <span class="highlight">Anywhere</span>
    </h1>

    <p class="hero-text">
        Register to request freight quotations,
        track shipments, and receive shipment updates.
    </p>

    <!-- Slider Dots -->
    <div class="slider-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <!-- Button -->
    <button class="create-btn"
    onclick="window.location.href='user_register.html'">
        Create Account
    </button>

    <div class="login-link">
        Already have an account?
        <a href="user_login.html">Log in</a>
    </div>

</div>

</div>

<script>

const dots=document.querySelectorAll('.dot');
let current=0;

setInterval(()=>{

    dots.forEach(dot=>{
        dot.classList.remove('active');
    });

    current++;

    if(current>=dots.length){
        current=0;
    }
    dots[current].classList.add('active');
},3000);

</script>

</body>
</html>
