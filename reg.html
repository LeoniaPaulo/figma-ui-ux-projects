<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zamvargo | Create Account</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(
        135deg,
        rgba(20,90,160,.85),
        rgba(0,190,150,.75)
    ),
    url("https://images.unsplash.com/photo-1556761175-b413da4baf72")
    center/cover no-repeat;

    overflow:hidden;
}


/* Glass Container */

.container{

    width:95%;
    max-width:430px;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(18px);

    border-radius:25px;

    padding:30px;

    color:white;

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);

}


/* Header */

.logo{

    text-align:center;
    font-size:28px;
    font-weight:700;
    margin-bottom:5px;

}


.subtitle{

    text-align:center;
    font-size:14px;
    opacity:.85;
    margin-bottom:25px;

}



/* Progress */

.progress{

    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;

}

.progress span{

    width:10px;
    height:10px;
    background:white;
    opacity:.4;
    border-radius:50%;

}

.progress .active{

    opacity:1;
    transform:scale(1.3);

}


/* Steps */

.step{

    display:none;

}

.step.active{

    display:block;

    animation:slide .35s ease;

}


@keyframes slide{

from{
    opacity:0;
    transform:translateX(30px);
}

to{
    opacity:1;
    transform:translateX(0);
}

}



label{

    font-size:13px;
    margin-bottom:6px;
    display:block;

}



input,select{

    width:100%;
    padding:13px;

    border:none;
    outline:none;

    border-radius:12px;

    margin-bottom:15px;

    background:
    rgba(255,255,255,.9);

    color:#333;

}



.phone{

    display:flex;
    gap:8px;

}


.phone span{

    background:white;
    color:#333;

    padding:13px;

    border-radius:12px;

}


.phone input{

    margin:0;

}




button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:30px;

    background:#00c389;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    margin-top:10px;

    transition:.3s;

}


button:hover{

    transform:translateY(-2px);

    background:#00a878;

}


.back{

    background:rgba(255,255,255,.3);

    margin-top:10px;

}


.check{

    display:flex;

    gap:8px;

    font-size:13px;

    margin-bottom:12px;

}


.check input{

    width:auto;
    margin:0;

}



.login{

    text-align:center;

    margin-top:18px;

    font-size:14px;

}


.login a{

    color:white;

    font-weight:bold;

}



/* Mobile */

@media(max-width:480px){

.container{

padding:25px;

}


.logo{

font-size:24px;

}

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
Zamvargo
</div>


<div class="subtitle">
Create Your Account
</div>


<div class="progress">
<span class="active"></span>
<span></span>
<span></span>
</div>



<form id="registerForm">


<!-- STEP 1 -->

<div class="step active">


<label>Full Name</label>
<input 
type="text"
placeholder="Enter your fullname"
required>


<label>Email Address</label>
<input 
type="email"
placeholder="Enter your email address"
required>



<label>Phone Number</label>

<div class="phone">

<span>+255</span>

<input 
type="tel"
placeholder="Enter your phone number"
required>

</div>



<button type="button" onclick="nextStep()">
Continue
</button>


</div>






<!-- STEP 2 -->


<div class="step">


<label>
Location (Country/City)
</label>


<select required>

<option>
Select your country or city
</option>

<option>
Tanzania
</option>

<option>
Zambia
</option>

<option>
Kenya
</option>

<option>
Other
</option>

</select>



<label>Password</label>

<input 
type="password"
id="password"
placeholder="Create a password"
required>



<label>
Confirm Password
</label>


<input
type="password"
id="confirm"
placeholder="Confirm your password"
required>



<button type="button" class="back" onclick="prevStep()">
Back
</button>


<button type="button" onclick="nextStep()">
Continue
</button>


</div>







<!-- STEP 3 -->


<div class="step">


<div class="check">

<input type="checkbox" id="terms">

<label>
I agree to the Terms and Conditions
</label>

</div>



<div class="check">

<input type="checkbox" id="privacy">

<label>
I agree to the Privacy Policy
</label>

</div>



<button type="submit">

Create Account

</button>


<button 
type="button"
class="back"
onclick="prevStep()">

Back

</button>



<div class="login">

Already have an account?

<a href="#">
Log in
</a>

</div>



</div>




</form>


</div>




<script>


let currentStep=0;

const steps=document.querySelectorAll(".step");

const dots=document.querySelectorAll(".progress span");



function showStep(){

steps.forEach((step,index)=>{

step.classList.toggle(
"active",
index===currentStep
);

});


dots.forEach((dot,index)=>{

dot.classList.toggle(
"active",
index===currentStep
);

});

}



function nextStep(){


if(currentStep===1){

let pass=document.getElementById("password").value;

let confirm=document.getElementById("confirm").value;


if(pass!==confirm){

alert("Passwords do not match");

return;

}

}


if(currentStep < steps.length-1){

currentStep++;

showStep();

}


}




function prevStep(){


if(currentStep>0){

currentStep--;

showStep();

}

}



document
.getElementById("registerForm")
.addEventListener(
"submit",
function(e){


e.preventDefault();


if(!document.getElementById("terms").checked ||
!document.getElementById("privacy").checked)
{

alert(
"Please accept Terms and Privacy Policy"
);

return;

}


alert(
"Account created successfully!"
);


}

);



</script>


</body>

</html>
